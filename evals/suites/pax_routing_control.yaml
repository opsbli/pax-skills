# pax_routing_control — description 对照组（剥离「不要直接选择」禁令）
#
# 用途：v2.0 基线的 100% 命中率是在「13 条 description 明写不要直接选择」的条件下
# 得到的。本套件把禁令剥掉、保留能力描述，与 v2.0 同模型同参数同数据集，
# 用来量出禁令贡献了多少命中率，即模型在无指示下的真实区分能力。
# 生成方式：python evals/build_control_subjects.py（skills.dir 指向派生的对照组目录）
#
# 评测目标：pax-orchestrate 作为 L0 入口，能否在 18 个 pax skill 的 catalog 里
# 被正确选中（正面/歧义/多任务请求），并能在非 pax 请求上正确拒答。
#
# mode=routing_only：不执行 skill、不给 tool，只暴露 frontmatter 元数据。
# 所以这里测的是「入口选择正确性」，不是内部意图分类/风险评分
# （那部分由 tests/test_orchestrate_routing.py 单元测试覆盖）。
#
# 相对 v1.0 的关键修正（2026-10-02）：
#   v1.0 的 include: [pax-orchestrate] 让 catalog 里只有一个 skill ——
#   模型没有其他选项，正面案例的命中率按构造必然接近 100%，测不出任何东西。
#   现在 include 是全部 18 个 skill，正面案例才真正考验「在 17 个干扰项里
#   选中 L0 入口」，歧义案例才有暴露 MECE 边界的能力。
suite_id: pax_routing_control
suite_version: "2.1-control"
description: >
  pax-* 家族路由基线。19 个用例：10 pos + 4 amb + 3 rej + 2 multi。
  catalog 为全部 18 个 pax skill，expected 为 pax-orchestrate（rej 类为空集）。

# --- 问题集 ---
# 路径是相对于 skillEval ROOT 的相对路径（plan.py 里 `ROOT / suite["dataset"]`）。
# skillEval ROOT = <父目录>/agent-skills-tooling/skillEval，pax-skills 与 agent-skills-tooling
# 在同一父目录下，所以用 `../../pax-skills/...`。换机只要求两个仓库保持这个相对位置；
# 不再写死 `C:/Users/<owner>/...`。若布局变化，改成绝对路径即可。
dataset: ../../pax-skills/evals/datasets/pax_routing_v1.0.jsonl
dataset_kind: capability

# --- 执行环境 ---
runtime: litellm
routing_input:
  strategy: direct
  options: {}

# --- 被测对象 ---
skills:
  # 由 evals/build_control_subjects.py 从 subjects/ 派生；勿手工编辑。
  # 与 subjects/ 的唯一差异：frontmatter description 剥离了「不要直接选择」类禁令。
  dir: ../../pax-skills/evals/subjects_control_no_prohibition
  # target 是实验归属，与 include（模型看见谁）严格分开。
  target: [pax-orchestrate]
  include:
    [pax-advisor, pax-clarify, pax-council, pax-deploy, pax-diagnose, pax-docs,
     pax-evolve, pax-execute, pax-learn, pax-monitor, pax-orchestrate, pax-plan,
     pax-review, pax-rollback, pax-test, pax-verify, pax-worker-implement,
     pax-worker-research]
  mode: routing_only
  cfg: v1

models:
  # DeepSeek OpenAI 兼容端点（api.deepseek.com 官方端点，2026-10-02 实测）。
  # 该账号可用模型：deepseek-flash / deepseek-v4-pro。deepseek-flash 是本机当前会话模型。
  # 密钥与端点写 skillEval/.env（已 gitignore），不在套件里存值。
  - id: deepseek-flash
    model: openai/deepseek-flash
    api_base_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    params:
      temperature: 0

tools: []
repeats: 3
parallelism: 1

# --- 维度评分 ---
scoring:
  # D2 决策（2026-10-03）：多目标/歧义请求入口单选，由 orchestrator 在工作流内分发。
  # 因而不是「一次选多个 skill」的题目，multi_exact 已无实际可选题目（结构性 n/a），
  # 一个永远 NaN 的指标留在报告里只会让人去解读一个没有定义的数字，所以移除。
  metrics: [exact_set_match, top1, no_skill_rejection, false_activation,
            by_type, per_skill_prf, confusion_matrix]
  gate:
    exact_set_match: ">= 0.80"
    top1: ">= 0.85"
    no_skill_rejection: ">= 0.90"
    false_activation: "<= 0.10"
    type_amb: ">= 0.70"
