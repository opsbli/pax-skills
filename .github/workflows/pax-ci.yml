name: pax-ci

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'pax-ops/**'
      - 'schemas/**'
      - 'references/**'
      - 'evals/**'
      - 'pyproject.toml'
      - '.github/workflows/pax-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'pax-ops/**'
      - 'schemas/**'
      - 'references/**'
      - 'evals/**'
      - 'pyproject.toml'
      - '.github/workflows/pax-ci.yml'
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. 契约测试 + 单元测试
  # ============================================================
  contracts-and-tests:
    name: Contracts & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pax-forge contracts
        run: |
          echo "=== Running pax-forge contract checks ==="
          python -m pax test
          echo "=== All contracts passed ==="

      - name: Run pytest
        run: |
          echo "=== Running pytest ==="
          pytest -q --tb=short
          echo "=== All tests passed ==="

      - name: Verify version consistency
        run: |
          echo "=== Checking version consistency ==="
          python -c "
          import json, sys
          from pathlib import Path
          
          versions = json.loads(Path('pax-ops/versions.json').read_text())
          skills_dir = Path('skills')
          errors = []
          
          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir() or skill_dir.name.startswith('.'):
                  continue
              skill_md = skill_dir / 'SKILL.md'
              if not skill_md.exists():
                  continue
              
              # Extract version from frontmatter
              text = skill_md.read_text(encoding='utf-8')
              import re
              match = re.search(r'^version:\s*(.+)$', text, re.MULTILINE)
              if not match:
                  errors.append(f'{skill_dir.name}: missing version in frontmatter')
                  continue
              
              skill_version = match.group(1).strip()
              skill_name = skill_dir.name
              
              if skill_name not in versions.get('skills', {}):
                  errors.append(f'{skill_name}: not in versions.json')
                  continue
              
              expected_version = versions['skills'][skill_name]['version']
              if skill_version != expected_version:
                  errors.append(f'{skill_name}: SKILL.md version {skill_version} != versions.json {expected_version}')
          
          if errors:
              print('VERSION INCONSISTENCIES:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('All versions consistent')
          "

  # ============================================================
  # 2. 路由评估（可选，需要 API Key）
  # ============================================================
  routing-eval:
    name: Routing Evaluation
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    # 仅在 main / 手动触发时执行；并且必须显式声明 tools/ 工具链可用。
    # tools/ 被 .gitignore 忽略，CI 检出中不存在，所以默认跳过而不是失败。
    # 详见 CONTRIBUTING.md「CI 门禁与外部工具」。
    if: >-
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && vars.PAX_TOOLS_AVAILABLE == 'true'
    timeout-minutes: 30

    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Assert tools/skillEval is present
        run: |
          if [ ! -d tools/skillEval ]; then
            echo "::error title=tools/skillEval 缺失::PAX_TOOLS_AVAILABLE 已置为 true，但 tools/skillEval 不在检出内容中；请先 vendor 工具链，或取消该变量。"
            exit 1
          fi

      - name: Install skillEval
        run: |
          cd tools/skillEval
          pip install -r requirements.txt

      - name: Run routing evaluation (mock mode)
        run: |
          cd tools/skillEval
          echo "=== Running routing evaluation in mock mode ==="
          python -m pipeline plan \
            --suite ../../evals/suites/pax_routing.yaml \
            --mock
          echo "=== Routing evaluation completed ==="

      - name: Run routing evaluation (real mode)
        # 注意：secrets 上下文不能出现在 step 级 if（GitHub 会在解析阶段
        # 直接拒绝整个 workflow 文件），必须经 job 级 env 中转后再判断。
        if: env.DASHSCOPE_API_KEY != ''
        run: |
          cd tools/skillEval
          echo "=== Running routing evaluation with real model ==="
          python -m pipeline plan \
            --suite ../../evals/suites/pax_routing.yaml
          python -m pipeline run \
            --suite ../../evals/suites/pax_routing.yaml
          python -m pipeline score \
            --suite ../../evals/suites/pax_routing.yaml
          echo "=== Routing evaluation completed ==="

  # ============================================================
  # 3. 内部路由验证（可选）
  # ============================================================
  internal-routing-check:
    name: Internal Routing Logic Check
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate internal routing test cases
        run: |
          echo "=== Validating internal routing test cases ==="
          python scripts/validate_internal_routing.py
          echo "=== All test cases valid ==="

  # ============================================================
  # 4. Skill 质量门禁
  # ============================================================
  quality-gate:
    name: Skill Quality Gate
    runs-on: ubuntu-latest
    needs: [contracts-and-tests, internal-routing-check]
    # 依赖 tools/quality_gate.py，该路径被 .gitignore 忽略、CI 检出中不存在 →
    # 默认跳过；要真正执行需把工具 vendor 进版本库并置 PAX_TOOLS_AVAILABLE=true。
    if: vars.PAX_TOOLS_AVAILABLE == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert tools/quality_gate.py is present
        run: |
          if [ ! -f tools/quality_gate.py ]; then
            echo "::error title=tools/quality_gate.py 缺失::PAX_TOOLS_AVAILABLE 已置为 true，但 tools/quality_gate.py 不在检出内容中。"
            exit 1
          fi

      - name: Run quality gate checks
        run: |
          echo "=== Running Skill Quality Gate ==="
          python tools/quality_gate.py
          echo "=== Quality gate passed ==="

  # ============================================================
  # 5. agentskills-ci：Skill 静态质量与安全评分
  # ============================================================
  agentskills-ci-check:
    name: Agent Skills CI
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install agentskills-ci
        run: pip install agentskills-ci

      - name: Install pax (for the `pax-forge agentskills-ci` wrapper)
        run: pip install -e .

      - name: Score skills directory
        run: |
          set -o pipefail
          # Hard gate: every skill must score >= 80/100 with no error-level
          # issues.  The wrapper below is a thin `pax-forge` subcommand that
          # shells out to the `agentskills-ci` binary, so this job stays in
          # lock-step with the same entrypoint developers use locally.
          #
          # See CONTRIBUTING.md for how to satisfy the recommended-section
          # and trigger-prefix requirements.
          python -m pax.forge.cli agentskills-ci \
            --skills-dir ./skills \
            --min-score 80 \
            --format markdown \
            -o /tmp/agentskills-report.md \
            2>&1 | tee /tmp/agentskills-score.log
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Agent Skills CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat /tmp/agentskills-score.log >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentskills-ci-report
          path: /tmp/agentskills-report.md
          if-no-files-found: ignore

      - name: Warn on dangerous patterns
        run: |
          if grep -q "rm -rf\|curl | bash\|chmod 777" /tmp/agentskills-report.md 2>/dev/null; then
            echo "::warning::agentskills-ci flagged a dangerous shell pattern; please review the uploaded report."
          fi

  # ============================================================
  # 6. skilldiff：行为回归测试
  # ============================================================
  # Runs pax-clarify against a small fixture in a real agent harness and
  # compares observable behavior (files changed, tool calls, output text)
  # between base (origin/main) and the candidate commit.
  #
  # Requires Node 20 and a live harness auth. The default harness is
  # Claude Code — see CONTRIBUTING.md for how to enable opencode,
  # codex, or Freebuff instead. When no harness is configured the job
  # skips gracefully and reports a skip notice.
  # ============================================================
  skilldiff-regression:
    name: SkillDiff Regression
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 20
    continue-on-error: true  # advisory until a default harness is configured

    env:
      # Set SKILLDIFF_HARNESS to: claude | codex | opencode | freebuff
      SKILLDIFF_HARNESS: ${{ vars.SKILLDIFF_HARNESS }}
      # Claude Code
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Codex
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Freebuff / Codebuff
      CODEBUFF_API_KEY: ${{ secrets.CODEBUFF_API_KEY }}

    steps:
      - name: Checkout (with base ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect tools/ availability
        id: tools
        shell: bash
        run: |
          if [ -d tools/skilldiff/examples/traces ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=tools/ 缺失::recorded demo 未执行（tools/skilldiff/examples/traces 不在检出内容中，.gitignore 忽略 tools/）"
          fi

      - name: Detect available harness
        id: harness
        shell: bash
        run: |
          set -e
          : "${SKILLDIFF_HARNESS:-}"
          if [ -z "$SKILLDIFF_HARNESS" ]; then
            # Auto-detect: prefer Claude Code, then codex, then opencode, then Freebuff
            if [ -n "$ANTHROPIC_API_KEY" ] || command -v claude >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="claude"
            elif [ -n "$OPENAI_API_KEY" ] || command -v codex >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="codex"
            elif command -v opencode >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="opencode"
            elif [ -n "$CODEBUFF_API_KEY" ]; then
              SKILLDIFF_HARNESS="freebuff"
            fi
          fi
          echo "harness=$SKILLDIFF_HARNESS" >> $GITHUB_OUTPUT
          echo "Detected harness: ${SKILLDIFF_HARNESS:-<none>}" >> $GITHUB_STEP_SUMMARY

      - name: Skip when no harness is configured
        if: steps.harness.outputs.harness == ''
        run: |
          echo "No harness available — skipping skilldiff. Set SKILLDIFF_HARNESS in repo vars or add an auth secret." >> $GITHUB_STEP_SUMMARY

      - name: Run skilldiff (live)
        if: steps.harness.outputs.harness != ''
        run: |
          set -e
          mkdir -p evals/skilldiff
          npx --yes skilldiff run \
            evals/skilldiff/pax-clarify.scenario.yaml \
            --live --base origin/main \
            --harness "$SKILLDIFF_HARNESS"

      - name: Recorded demo skipped (tools/ unavailable)
        if: steps.tools.outputs.available != 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SkillDiff recorded demo" >> "$GITHUB_STEP_SUMMARY"
          echo '未在 CI 中执行：`tools/skilldiff/examples/traces` 不在检出内容中（`.gitignore` 忽略 `tools/`）。' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Record a demo diff (requires tools/)
        if: always() && steps.tools.outputs.available == 'true'
        run: |
          # Always emit a recorded-mode demo so the artifact pipeline has
          # something to look at even when no live harness is configured.
          # We pin to the packaged examples/traces pair that ships with the
          # skilldiff repo.
          #
          # NOTE: the `skilldiff orbit` visualizer is not yet published on
          # npm (source is in tools/skilldiff/src/orbit.ts but dist is
          # missing). We capture the text report instead; the artifact is
          # still useful for triaging regressions.
          mkdir -p evals/skilldiff
          set +e
          npx --yes skilldiff run \
            evals/skilldiff/pax-clarify.scenario.yaml \
            --old tools/skilldiff/examples/traces/notes-helper-old.json \
            --new tools/skilldiff/examples/traces/notes-helper-new.json \
            > evals/skilldiff/latest-recorded-report.md 2>&1
          echo "$?" > evals/skilldiff/latest-recorded-report.exitcode
          set -e
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SkillDiff recorded demo" >> $GITHUB_STEP_SUMMARY
          echo "Uploaded: evals/skilldiff/latest-recorded-report.md (recorded mode against examples/traces)." >> $GITHUB_STEP_SUMMARY
          echo "Set ANTHROPIC_API_KEY / OPENAI_API_KEY / CODEBUFF_API_KEY in" >> $GITHUB_STEP_SUMMARY
          echo "repo secrets to enable a live run — see CONTRIBUTING.md." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload skilldiff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilldiff-report
          path: |
            evals/skilldiff/latest-recorded-report.md
            evals/skilldiff/latest-recorded-report.exitcode
            evals/skilldiff/traces/
          if-no-files-found: ignore

  # ============================================================
  # 7. 质量门禁摘要
  # ============================================================
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [contracts-and-tests, internal-routing-check, quality-gate, routing-eval, agentskills-ci-check, skilldiff-regression]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Summary
        env:
          CONTRACTS: ${{ needs.contracts-and-tests.result }}
          INTERNAL: ${{ needs.internal-routing-check.result }}
          QUALITY: ${{ needs.quality-gate.result }}
          ROUTING: ${{ needs.routing-eval.result }}
          AGENTSKILLS: ${{ needs.agentskills-ci-check.result }}
          SKILLDIFF: ${{ needs.skilldiff-regression.result }}
        run: |
          {
            echo "## pax-* CI Quality Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            printf '| %s | `%s` |\n' "Contracts & Tests" "$CONTRACTS"
            printf '| %s | `%s` |\n' "Internal Routing" "$INTERNAL"
            printf '| %s | `%s` |\n' "Skill Quality Gate" "$QUALITY"
            printf '| %s | `%s` |\n' "Routing Eval" "$ROUTING"
            printf '| %s | `%s` |\n' "Agent Skills CI" "$AGENTSKILLS"
            printf '| %s | `%s` |\n' "SkillDiff Regression" "$SKILLDIFF"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          not_run=""
          for pair in \
            "Contracts & Tests=$CONTRACTS" \
            "Internal Routing=$INTERNAL" \
            "Skill Quality Gate=$QUALITY" \
            "Routing Eval=$ROUTING" \
            "Agent Skills CI=$AGENTSKILLS" \
            "SkillDiff Regression=$SKILLDIFF"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            case "$result" in
              success) ;;
              skipped) not_run="$not_run\n- $name" ;;
              *) failed="$failed\n- $name：$result" ;;
            esac
          done

          if [ -n "$failed" ]; then
            printf '❌ **质量门禁失败**%b\n' "$failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$not_run" ]; then
            printf '⚠️ **以下检查本次未执行（已执行的检查全部通过）**%b\n' "$not_run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '未执行的两类原因：① job 触发条件不满足（如 Routing Eval 仅在 main / 手动触发时运行）；② 依赖 `tools/` 工具链的 job 在仓库变量 `PAX_TOOLS_AVAILABLE` 未置 `true` 时跳过——`tools/` 被 `.gitignore` 忽略，CI 检出中不存在。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **All quality gates passed**" >> "$GITHUB_STEP_SUMMARY"
          fi
