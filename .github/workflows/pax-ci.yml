name: pax-ci

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'pax-ops/**'
      - 'schemas/**'
      - 'references/**'
      - 'evals/**'
      - 'pyproject.toml'
      - '.github/workflows/pax-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'pax-ops/**'
      - 'schemas/**'
      - 'references/**'
      - 'evals/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. 契约测试 + 单元测试
  # ============================================================
  contracts-and-tests:
    name: Contracts & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pax-forge contracts
        run: |
          echo "=== Running pax-forge contract checks ==="
          python -m pax test
          echo "=== All contracts passed ==="

      - name: Run pytest
        run: |
          echo "=== Running pytest ==="
          pytest -q --tb=short
          echo "=== All tests passed ==="

      - name: Verify version consistency
        run: |
          echo "=== Checking version consistency ==="
          python -c "
          import json, sys
          from pathlib import Path
          
          versions = json.loads(Path('pax-ops/versions.json').read_text())
          skills_dir = Path('skills')
          errors = []
          
          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir() or skill_dir.name.startswith('.'):
                  continue
              skill_md = skill_dir / 'SKILL.md'
              if not skill_md.exists():
                  continue
              
              # Extract version from frontmatter
              text = skill_md.read_text(encoding='utf-8')
              import re
              match = re.search(r'^version:\s*(.+)$', text, re.MULTILINE)
              if not match:
                  errors.append(f'{skill_dir.name}: missing version in frontmatter')
                  continue
              
              skill_version = match.group(1).strip()
              skill_name = skill_dir.name
              
              if skill_name not in versions.get('skills', {}):
                  errors.append(f'{skill_name}: not in versions.json')
                  continue
              
              expected_version = versions['skills'][skill_name]['version']
              if skill_version != expected_version:
                  errors.append(f'{skill_name}: SKILL.md version {skill_version} != versions.json {expected_version}')
          
          if errors:
              print('VERSION INCONSISTENCIES:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('All versions consistent')
          "

  # ============================================================
  # 2. 路由评估（可选，需要 API Key）
  # ============================================================
  routing-eval:
    name: Routing Evaluation
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install skillEval
        run: |
          cd tools/skillEval
          pip install -r requirements.txt

      - name: Run routing evaluation (mock mode)
        run: |
          cd tools/skillEval
          echo "=== Running routing evaluation in mock mode ==="
          python -m pipeline plan \
            --suite ../../evals/suites/pax_routing.yaml \
            --mock
          echo "=== Routing evaluation completed ==="

      - name: Run routing evaluation (real mode)
        if: secrets.DASHSCOPE_API_KEY != ''
        run: |
          cd tools/skillEval
          echo "=== Running routing evaluation with real model ==="
          python -m pipeline plan \
            --suite ../../evals/suites/pax_routing.yaml
          python -m pipeline run \
            --suite ../../evals/suites/pax_routing.yaml
          python -m pipeline score \
            --suite ../../evals/suites/pax_routing.yaml
          echo "=== Routing evaluation completed ==="
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}

  # ============================================================
  # 3. 内部路由验证（可选）
  # ============================================================
  internal-routing-check:
    name: Internal Routing Logic Check
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate internal routing test cases
        run: |
          echo "=== Validating internal routing test cases ==="
          python -c "
          import json
          from pathlib import Path
          
          data = json.loads(Path('evals/datasets/pax_internal_routing_v1.0.json').read_text())
          categories = data['categories']
          
          total = 0
          for cat_name, cat_data in categories.items():
              cases = cat_data['cases']
              total += len(cases)
              print(f'  {cat_name}: {len(cases)} cases')
              
              for case in cases:
                  # Validate required fields
                  if 'id' not in case:
                      print(f'    ERROR: {cat_name} missing id in case')
                      exit(1)
                  if 'input' not in case:
                      print(f'    ERROR: {case[\"id\"]} missing input')
                      exit(1)
                  if 'expected_primary' not in case and cat_name == 'intent_classification':
                      print(f'    ERROR: {case[\"id\"]} missing expected_primary')
                      exit(1)
              
          print(f'  Total: {total} cases')
          print('=== All test cases valid ===')
          "

  # ============================================================
  # 4. Skill 质量门禁
  # ============================================================
  quality-gate:
    name: Skill Quality Gate
    runs-on: ubuntu-latest
    needs: [contracts-and-tests, internal-routing-check]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality gate checks
        run: |
          echo "=== Running Skill Quality Gate ==="
          python tools/quality_gate.py
          echo "=== Quality gate passed ==="

  # ============================================================
  # 5. agentskills-ci：Skill 静态质量与安全评分
  # ============================================================
  agentskills-ci-check:
    name: Agent Skills CI
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install agentskills-ci
        run: pip install agentskills-ci

      - name: Score skills directory
        run: |
          set -o pipefail
          # Hard gate: every skill must score >= 80/100 with no error-level issues.
          # See CONTRIBUTING.md for how to satisfy the recommended-section and
          # trigger-prefix requirements.
          agentskills-ci score ./skills --format markdown --min-score 80 -o /tmp/agentskills-report.md 2>&1 | tee /tmp/agentskills-score.log
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Agent Skills CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat /tmp/agentskills-score.log >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentskills-ci-report
          path: /tmp/agentskills-report.md
          if-no-files-found: ignore

      - name: Warn on dangerous patterns
        run: |
          if grep -q "rm -rf\|curl | bash\|chmod 777" /tmp/agentskills-report.md 2>/dev/null; then
            echo "::warning::agentskills-ci flagged a dangerous shell pattern; please review the uploaded report."
          fi

  # ============================================================
  # 6. skilldiff：行为回归测试
  # ============================================================
  # Runs pax-clarify against a small fixture in a real agent harness and
  # compares observable behavior (files changed, tool calls, output text)
  # between base (origin/main) and the candidate commit.
  #
  # Requires Node 20 and a live harness auth. The default harness is
  # Claude Code — see CONTRIBUTING.md for how to enable opencode,
  # codex, or Freebuff instead. When no harness is configured the job
  # skips gracefully and reports a skip notice.
  # ============================================================
  skilldiff-regression:
    name: SkillDiff Regression
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    timeout-minutes: 20
    continue-on-error: true  # advisory until a default harness is configured

    env:
      # Set SKILLDIFF_HARNESS to: claude | codex | opencode | freebuff
      SKILLDIFF_HARNESS: ${{ vars.SKILLDIFF_HARNESS }}
      # Claude Code
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Codex
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Freebuff / Codebuff
      CODEBUFF_API_KEY: ${{ secrets.CODEBUFF_API_KEY }}

    steps:
      - name: Checkout (with base ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect available harness
        id: harness
        shell: bash
        run: |
          set -e
          : "${SKILLDIFF_HARNESS:-}"
          if [ -z "$SKILLDIFF_HARNESS" ]; then
            # Auto-detect: prefer Claude Code, then codex, then opencode, then Freebuff
            if [ -n "$ANTHROPIC_API_KEY" ] || command -v claude >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="claude"
            elif [ -n "$OPENAI_API_KEY" ] || command -v codex >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="codex"
            elif command -v opencode >/dev/null 2>&1; then
              SKILLDIFF_HARNESS="opencode"
            elif [ -n "$CODEBUFF_API_KEY" ]; then
              SKILLDIFF_HARNESS="freebuff"
            fi
          fi
          echo "harness=$SKILLDIFF_HARNESS" >> $GITHUB_OUTPUT
          echo "Detected harness: ${SKILLDIFF_HARNESS:-<none>}" >> $GITHUB_STEP_SUMMARY

      - name: Skip when no harness is configured
        if: steps.harness.outputs.harness == ''
        run: |
          echo "No harness available — skipping skilldiff. Set SKILLDIFF_HARNESS in repo vars or add an auth secret." >> $GITHUB_STEP_SUMMARY

      - name: Run skilldiff (live)
        if: steps.harness.outputs.harness != ''
        run: |
          set -e
          mkdir -p evals/skilldiff/traces
          npx --yes skilldiff run \
            evals/skilldiff/pax-clarify.scenario.yaml \
            --live --base origin/main \
            --harness "$SKILLDIFF_HARNESS"

      - name: Record a demo diff (always runs)
        if: always()
        run: |
          # Keep a local recorded run so the artifact pipeline always has something.
          npx --yes skilldiff orbit \
            tools/skilldiff/examples/traces/old.json \
            tools/skilldiff/examples/traces/new.json \
            --out evals/skilldiff/latest-orbit.html 2>&1 || true

      - name: Upload skilldiff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilldiff-report
          path: |
            evals/skilldiff/latest-orbit.html
            evals/skilldiff/traces/
          if-no-files-found: ignore

  # ============================================================
  # 7. 质量门禁摘要
  # ============================================================
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [contracts-and-tests, internal-routing-check, quality-gate, routing-eval, agentskills-ci-check, skilldiff-regression]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Summary
        run: |
          echo "## pax-* CI Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts & Tests | ${{ needs.contracts-and-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Internal Routing | ${{ needs.internal-routing-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skill Quality Gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Routing Eval | ${{ needs.routing-eval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Skills CI | ${{ needs.agentskills-ci-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SkillDiff Regression | ${{ needs.skilldiff-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.contracts-and-tests.result }}" = "success" ] && 
             [ "${{ needs.internal-routing-check.result }}" = "success" ] && 
             [ "${{ needs.quality-gate.result }}" = "success" ]; then
            echo "✅ **All quality gates passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality gate failed**" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed checks above." >> $GITHUB_STEP_SUMMARY
          fi
